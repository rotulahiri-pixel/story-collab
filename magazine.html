<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RelayTale Magazine</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.2"></script>
    <style>
        :root {
            --cream: #f5f0e8;
            --sepia: #e8dcc8;
            --ink: #2c2416;
            --accent: #8b4513;
            --gold: #b8860b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #2c1810;
            background-image: radial-gradient(ellipse at center, #4a2a1a 0%, #1a0c06 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 0.5rem;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            justify-content: space-between;
        }
        .book-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .book-spine {
            position: absolute;
            top: 0; left: -22px; bottom: 0; width: 22px;
            background: linear-gradient(to right, #3c1e0f, #5a2d1a, #3c1e0f);
            border-radius: 5px 0 0 5px;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .book-flip-container {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1500px;
            max-height: 70vh;
        }
        .page {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--cream);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 30px rgba(139,69,19,0.05);
            transform-origin: left center;
            transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1);
            backface-visibility: hidden;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .page.flipped { transform: rotateY(-180deg); }
        .page-content {
            flex: 1;
            padding: 1.2rem 1rem;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--ink);
            -webkit-overflow-scrolling: touch;
        }
        .page-number {
            text-align: center;
            font-size: 0.7rem;
            color: var(--accent);
            padding: 0.4rem;
            border-top: 1px solid var(--sepia);
            background: var(--cream);
        }

        /* Morocco leather cover */
        .cover-page {
            background: linear-gradient(135deg, #5a2d1a 0%, #3c1e0f 40%, #2a1005 100%);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding-top: 20%;
            position: relative;
            height: 100%;
            color: var(--cream);
        }
        .cover-page::before,
        .cover-page::after,
        .cover-page .corner-tr,
        .cover-page .corner-bl {
            position: absolute;
            width: 40px; height: 40px;
            border: 3px solid var(--gold);
            z-index: 2;
        }
        .cover-page::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
        .cover-page::after { bottom: 8px; right: 8px; border-left: none; border-top: none; }
        .cover-page .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
        .cover-page .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }

        .cover-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            margin-bottom: 0.5rem;
        }
        .cover-subtitle {
            font-size: 0.8rem;
            font-style: italic;
            color: var(--cream);
            letter-spacing: 2px;
        }
        .cover-divider {
            width: 50%;
            margin: 1rem auto;
            border-top: 2px double var(--gold);
        }

        /* Story title page */
        .story-title-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding-top: 25%;
            height: 100%;
            color: var(--ink);
            background: var(--cream);
        }
        .story-title-main {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            max-width: 90%;
            margin-bottom: 0.5rem;
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0.5rem 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-btn {
            background: var(--cream);
            color: var(--ink);
            border: 2px solid var(--accent);
            padding: 0.6rem 1.2rem;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            transition: all 0.3s;
            min-width: 80px;
            text-align: center;
        }
        .nav-btn:hover { background: var(--accent); color: var(--cream); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-indicator {
            color: var(--cream);
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        /* Fetch button on cover */
        .cover-fetch-btn {
            background: var(--gold);
            color: var(--ink);
            border: 2px solid var(--accent);
            padding: 0.5rem 1rem;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            margin-top: auto;
            margin-bottom: 1.5rem;
        }
        .cover-fetch-btn:hover { background: var(--accent); color: var(--cream); }
        .fetch-status {
            color: var(--cream);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            text-align: center;
            font-style: italic;
        }

        /* Typography */
        .story-authors { font-size: 0.7rem; font-style: italic; color: var(--accent); margin-top: 0.5rem; }
        .story-text { font-size: 0.85rem; line-height: 1.6; color: var(--ink); text-align: justify; white-space: pre-wrap; }
        .session-label { font-style: italic; color: var(--accent); font-size: 0.75rem; margin-bottom: 0.2rem; display: block; }
        .story-end { text-align: center; font-style: italic; color: var(--accent); margin-top: 0.4rem; font-size: 0.8rem; }
        .share-mini { font-size: 0.7rem; color: var(--accent); cursor: pointer; text-decoration: underline; margin-left: 0.5rem; }
        .disclaimer-text { font-size: 0.7rem; color: var(--cream); line-height: 1.5; margin-top: 2rem; opacity: 0.8; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="book-wrapper">
        <div class="book-spine"></div>
        <div class="book-flip-container" id="flipContainer"></div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()">◀ Prev</button>
        <button class="nav-btn" id="nextBtn" onclick="nextPage()">Next ▶</button>
    </div>
    <div class="page-indicator" id="pageIndicator">Cover</div>
</div>

<script>
    // ===== CONFIGURATION =====
    const PROJECT_ID = 'rotulahiri';   // ← CHANGE THIS
    const DATABASE_ID = 'stories_db';
    const STORIES_COLLECTION = 'stories';
    const CHAPTERS_COLLECTION = 'chapters';
    const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
    const EMAIL = 'relaytale@gmail.com';

    const MAX_CHARS_PER_PAGE = 1200;   // slightly reduced to accommodate line breaks
    const ORPHAN_MIN_CHARS = 80;       // minimum chars left on a page before forcing a break

    // Disclaimer text for back cover
    const DISCLAIMER = `Disclaimer: The creator of this app has no control over, and assumes no responsibility or liability for, any content, opinions, or views expressed by users on this platform. User‑generated content does not reflect the views of the creator, and all interactions and posts are the sole responsibility of the respective users. The Intellectual Property Rights of the collaborative effort will rest with the platform presently.`;

    // ===== STATE =====
    let pages = [
        { html: createCoverPage('RelayTale', 'Sample Issue', true), isCover: true }
    ];
    let currentPageIndex = 0;

    const flipContainer = document.getElementById('flipContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');

    // ===== COVER PAGE GENERATOR =====
    function createCoverPage(title, subtitle, includeFetch = false) {
        const fetchHTML = includeFetch ? `
            <button class="cover-fetch-btn" onclick="event.stopPropagation(); fetchLiveStories()">📡 Fetch Stories from Appwrite</button>
            <div id="fetchStatusCover" class="fetch-status"></div>
        ` : '';
        return `
            <div class="cover-page">
                <span class="corner-tl"></span><span class="corner-tr"></span><span class="corner-bl"></span><span class="corner-br"></span>
                <div class="cover-title">${title}</div>
                <div class="cover-divider"></div>
                <div class="cover-subtitle">Where Writers Create Stories By Turn</div>
                <div style="margin-top:2rem;font-size:0.8rem;letter-spacing:2px;">${subtitle}</div>
                <div style="margin-top:1rem;font-size:0.7rem;">${EMAIL}</div>
                ${fetchHTML}
            </div>`;
    }

    // ===== BACK COVER WITH DISCLAIMER =====
    function createBackCover() {
        return `
            <div class="cover-page">
                <span class="corner-tl"></span><span class="corner-tr"></span><span class="corner-bl"></span><span class="corner-br"></span>
                <div class="cover-title" style="font-size:2rem;">RelayTale</div>
                <div class="cover-divider"></div>
                <div class="cover-subtitle">Where Writers Create Stories By Turn</div>
                <div style="margin-top:1.5rem;font-size:0.8rem;letter-spacing:2px;">Published by RelayTale Press</div>
                <div style="margin-top:0.5rem;font-size:0.7rem;">${EMAIL}</div>
                <div class="disclaimer-text">${DISCLAIMER}</div>
            </div>`;
    }

    // ===== STORY TITLE PAGE =====
    function createStoryTitlePage(story) {
        return `
            <div class="story-title-page">
                <div class="story-title-main">${story.title}</div>
                <div class="story-authors">By ${story.writers || story.creatorName}</div>
            </div>`;
    }

    // ===== IMPROVED PAGINATION =====
    function paginateStory(story, chapters) {
        const pagesForStory = [];
        pagesForStory.push({ html: createStoryTitlePage(story), isStoryTitle: true });

        // Build the full text with session labels and explicit newlines
        let fullText = '';
        chapters.forEach(ch => {
            fullText += `<span class="session-label">Session ${ch.chapterNumber} — by ${ch.authorName}</span>\n`;
            // Append content, preserving any existing line breaks (they are part of the string)
            fullText += ch.content + '\n\n';
        });

        // We'll work with the raw string, respecting whitespace.
        // To split into pages, we tokenize by whitespace but keep newlines as separate tokens.
        const tokens = fullText.match(/[^ \t\n]+|\n/g) || [];
        let currentPage = '';
        let currentLen = 0;

        for (const token of tokens) {
            if (token === '\n') {
                // Always add newline characters (they consume almost no space)
                currentPage += '\n';
                continue;
            }

            const tokenLen = token.length;
            // +1 for a space if not at the beginning of the page
            const spaceNeeded = currentLen > 0 ? 1 : 0;

            if (currentLen + spaceNeeded + tokenLen <= MAX_CHARS_PER_PAGE) {
                if (currentLen > 0) currentPage += ' ';
                currentPage += token;
                currentLen += spaceNeeded + tokenLen;
            } else {
                // Page is full; save it and start a new one
                pagesForStory.push({ html: `<div style="padding:1rem;"><div class="story-text">${currentPage}</div></div>` });
                currentPage = token;
                currentLen = tokenLen;
            }
        }

        // Don't leave a nearly empty page at the end – orphan control
        if (currentLen > 0 && currentLen < ORPHAN_MIN_CHARS && pagesForStory.length > 0) {
            // Append the remaining text to the last page
            const lastPage = pagesForStory[pagesForStory.length - 1];
            lastPage.html = lastPage.html.replace('</div></div>', ` ${currentPage}</div></div>`);
        } else if (currentLen > 0) {
            pagesForStory.push({ html: `<div style="padding:1rem;"><div class="story-text">${currentPage}</div></div>` });
        }

        // Add end marker and share to last text page
        const lastIdx = pagesForStory.length - 1;
        const endHtml = `<p class="story-end">${story.status === 'completed' ? '🏁 The End' : '✍️ In Progress'} <span class="share-mini" onclick="shareStory('${story.title.replace(/'/g, "\\'")}')">Share</span></p>`;
        pagesForStory[lastIdx].html = pagesForStory[lastIdx].html.replace('</div></div>', `${endHtml}</div></div>`);

        return pagesForStory;
    }

    // ===== BUILD ALL PAGES =====
    function renderBook() {
        flipContainer.innerHTML = '';
        for (let i = pages.length - 1; i >= 0; i--) {
            const pageData = pages[i];
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.dataset.index = i;
            pageDiv.style.zIndex = pages.length - i;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'page-content';
            if (pageData.isCover || pageData.isStoryTitle) {
                contentDiv.style.padding = '0';
            }
            contentDiv.innerHTML = pageData.html;

            const pageNum = document.createElement('div');
            pageNum.className = 'page-number';
            pageNum.textContent = i + 1;

            pageDiv.appendChild(contentDiv);
            pageDiv.appendChild(pageNum);

            if (i < currentPageIndex) pageDiv.classList.add('flipped');
            flipContainer.appendChild(pageDiv);
        }
        updateNav();
    }

    function nextPage() {
        if (currentPageIndex < pages.length - 1) {
            flipContainer.querySelector(`[data-index="${currentPageIndex}"]`).classList.add('flipped');
            currentPageIndex++;
            updateNav();
        }
    }
    function prevPage() {
        if (currentPageIndex > 0) {
            currentPageIndex--;
            flipContainer.querySelector(`[data-index="${currentPageIndex}"]`).classList.remove('flipped');
            updateNav();
        }
    }
    function updateNav() {
        prevBtn.disabled = currentPageIndex === 0;
        nextBtn.disabled = currentPageIndex === pages.length - 1;
        pageIndicator.textContent = currentPageIndex === 0 ? 'Cover' : currentPageIndex === pages.length - 1 ? 'Back Cover' : `Page ${currentPageIndex + 1} of ${pages.length}`;
    }

    // ===== SHARE =====
    window.shareStory = function(title) {
        const url = window.location.href;
        const text = `Read "${title}" from RelayTale Monthly.`;
        if (navigator.share) navigator.share({ title, text, url }).catch(() => {});
        else {
            navigator.clipboard.writeText(text + ' ' + url).then(() => alert('Link copied!')).catch(() => prompt('Copy:', url));
        }
    };

    // ===== FETCH FROM APPWRITE =====
    window.fetchLiveStories = async function() {
        if (PROJECT_ID === 'YOUR_PROJECT_ID') {
            alert('Please replace YOUR_PROJECT_ID with your real Appwrite Project ID.');
            return;
        }
        const statusEl = document.getElementById('fetchStatusCover') || document.createElement('div');
        statusEl.textContent = 'Fetching...';
        try {
            const client = new Appwrite.Client();
            client.setEndpoint(ENDPOINT).setProject(PROJECT_ID);
            const databases = new Appwrite.Databases(client);
            const storiesRes = await databases.listDocuments(DATABASE_ID, STORIES_COLLECTION);
            if (storiesRes.documents.length === 0) {
                statusEl.textContent = 'No stories found.';
                return;
            }

            const newPages = [];
            const coverSubtitle = `Featuring: ${storiesRes.documents.map(s => s.title).join(' • ')}`;
            newPages.push({ html: createCoverPage('RelayTale', coverSubtitle, false), isCover: true });

            for (const story of storiesRes.documents) {
                const chRes = await databases.listDocuments(DATABASE_ID, CHAPTERS_COLLECTION, [
                    Appwrite.Query.equal('storyId', story.$id),
                    Appwrite.Query.orderAsc('chapterNumber')
                ]);
                const storyPages = paginateStory(story, chRes.documents);
                newPages.push(...storyPages);
            }

            // Back cover with disclaimer
            newPages.push({ html: createBackCover(), isCover: true });

            pages = newPages;
            currentPageIndex = 0;
            renderBook();
            statusEl.textContent = `✅ Loaded ${storiesRes.documents.length} stories!`;
        } catch (err) {
            statusEl.textContent = '❌ Error: ' + err.message;
            console.error(err);
        }
    };

    // ===== STABLE PAGE FLIP =====
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
        const dx = touchStartX - e.changedTouches[0].clientX;
        const dy = touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
            if (dx > 0) nextPage();
            else prevPage();
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextPage(); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevPage(); }
    });

    // ===== INIT =====
    renderBook();
</script>
</body>
</html>
