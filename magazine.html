<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RelayTale Magazine</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.2"></script>
    <style>
        :root {
            --cream: #f5f0e8;
            --sepia: #e8dcc8;
            --ink: #2c2416;
            --accent: #8b4513;
            --gold: #b8860b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #2c1810;
            background-image: radial-gradient(ellipse at center, #4a2a1a 0%, #1a0c06 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 0.5rem;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Fixed aspect‑ratio book – never resizes */
        .book-wrapper {
            position: relative;
            width: 100%;
            /* 9:16 portrait ratio */
            padding-bottom: 160%;
            margin: 0 auto;
            flex-shrink: 0;
        }
        .book-spine {
            position: absolute;
            top: 0; left: -22px; bottom: 0; width: 22px;
            background: linear-gradient(to right, #3c1e0f, #5a2d1a, #3c1e0f);
            border-radius: 5px 0 0 5px;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .book-flip-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            perspective: 1500px;
        }

        /* Page layout */
        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--cream);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 30px rgba(139,69,19,0.05);
            transform-origin: left center;
            transition: transform 0.5s ease;
            backface-visibility: hidden;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .page.flipped {
            transform: rotateY(-180deg);
        }
        .page-content {
            flex: 1;
            padding: 1.2rem 1rem 2.8rem 1rem;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--ink);
            -webkit-overflow-scrolling: touch;
        }
        .page-number {
            text-align: center;
            font-size: 0.7rem;
            color: var(--accent);
            padding: 0.4rem;
            border-top: 1px solid var(--sepia);
            background: var(--cream);
        }

        /* Morocco leather cover – identical to working build */
        .cover-page {
            background: linear-gradient(135deg, #5a2d1a 0%, #3c1e0f 40%, #2a1005 100%);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding-top: 20%;
            position: relative;
            height: 100%;
            color: var(--cream);
        }
        .cover-page::before,
        .cover-page::after,
        .cover-page .corner-tr,
        .cover-page .corner-bl {
            position: absolute;
            width: 40px; height: 40px;
            border: 3px solid var(--gold);
            z-index: 2;
        }
        .cover-page::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
        .cover-page::after { bottom: 8px; right: 8px; border-left: none; border-top: none; }
        .cover-page .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
        .cover-page .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }

        .cover-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            margin-bottom: 0.5rem;
        }
        .cover-subtitle {
            font-size: 0.8rem;
            font-style: italic;
            color: var(--cream);
            letter-spacing: 2px;
        }
        .cover-divider {
            width: 50%;
            margin: 1rem auto;
            border-top: 2px double var(--gold);
        }
        .cover-fetch-btn {
            background: var(--gold);
            color: var(--ink);
            border: 2px solid var(--accent);
            padding: 0.5rem 1rem;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            margin-top: auto;
            margin-bottom: 1.5rem;
        }
        .cover-fetch-btn:hover { background: var(--accent); color: var(--cream); }
        .fetch-status {
            color: var(--cream);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            text-align: center;
            font-style: italic;
        }

        /* Story title page */
        .story-title-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding-top: 25%;
            height: 100%;
            color: var(--ink);
            background: var(--cream);
        }
        .story-title-main {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            max-width: 90%;
            margin-bottom: 0.5rem;
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0.5rem 0;
            flex-wrap: wrap;
            justify-content: center;
            flex-shrink: 0;
        }
        .nav-btn {
            background: var(--cream);
            color: var(--ink);
            border: 2px solid var(--accent);
            padding: 0.6rem 1.2rem;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            transition: all 0.3s;
            min-width: 80px;
            text-align: center;
        }
        .nav-btn:hover { background: var(--accent); color: var(--cream); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-indicator {
            color: var(--cream);
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        /* Typography */
        .story-authors { font-size: 0.7rem; font-style: italic; color: var(--accent); margin-top: 0.5rem; }
        .story-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--ink);
            text-align: justify;
            white-space: pre-wrap;
        }
        .session-label { font-style: italic; color: var(--accent); font-size: 0.75rem; margin-bottom: 0.2rem; display: block; }
        .story-end { text-align: center; font-style: italic; color: var(--accent); margin-top: 0.4rem; font-size: 0.8rem; }
        .share-mini { font-size: 0.7rem; color: var(--accent); cursor: pointer; text-decoration: underline; margin-left: 0.5rem; }
        .disclaimer-text { font-size: 0.7rem; color: var(--cream); line-height: 1.5; margin-top: 2rem; opacity: 0.8; padding: 0 1rem; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="book-wrapper">
        <div class="book-spine"></div>
        <div class="book-flip-container" id="flipContainer"></div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()">◀ Prev</button>
        <button class="nav-btn" id="nextBtn" onclick="nextPage()">Next ▶</button>
    </div>
    <div class="page-indicator" id="pageIndicator">Cover</div>
</div>

<script>
    // ===== CONFIGURATION =====
    const PROJECT_ID = 'rotulahiri';   // ← CHANGE THIS
    const DATABASE_ID = 'stories_db';
    const STORIES_COLLECTION = 'stories';
    const CHAPTERS_COLLECTION = 'chapters';
    const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
    const EMAIL = 'relaytale@gmail.com';

    // Pagination settings (≈55-60 lines)
    const MAX_CHARS_PER_PAGE = 3200;
    const ORPHAN_MIN_CHARS = 100;

    const DISCLAIMER = `Disclaimer: The creator of this app has no control over, and assumes no responsibility or liability for, any content, opinions, or views expressed by users on this platform. User‑generated content does not reflect the views of the creator, and all interactions and posts are the sole responsibility of the respective users. The Intellectual Property Rights of the collaborative effort will rest with the platform presently.`;

    // ===== STATE =====
    let pages = [];                    // will be filled after fetch
    let currentPageIndex = 0;
    let isAnimating = false;          // lock to prevent rapid flips

    const flipContainer = document.getElementById('flipContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');

    // ===== COVER PAGE =====
    function createCoverPage(title, subtitle, includeFetch = false) {
        const fetchHTML = includeFetch ? `
            <button class="cover-fetch-btn" onclick="event.stopPropagation(); fetchLiveStories()">📡 Fetch Stories from Appwrite</button>
            <div id="fetchStatusCover" class="fetch-status"></div>
        ` : '';
        return `
            <div class="cover-page">
                <span class="corner-tl"></span><span class="corner-tr"></span><span class="corner-bl"></span><span class="corner-br"></span>
                <div class="cover-title">${title}</div>
                <div class="cover-divider"></div>
                <div class="cover-subtitle">Where Writers Create Stories By Turn</div>
                <div style="margin-top:2rem;font-size:0.8rem;letter-spacing:2px;">${subtitle}</div>
                <div style="margin-top:1rem;font-size:0.7rem;">${EMAIL}</div>
                ${fetchHTML}
            </div>`;
    }

    // ===== BACK COVER =====
    function createBackCover() {
        return `
            <div class="cover-page">
                <span class="corner-tl"></span><span class="corner-tr"></span><span class="corner-bl"></span><span class="corner-br"></span>
                <div class="cover-title" style="font-size:2rem;">RelayTale</div>
                <div class="cover-divider"></div>
                <div class="cover-subtitle">Where Writers Create Stories By Turn</div>
                <div style="margin-top:1.5rem;font-size:0.8rem;letter-spacing:2px;">Published by RelayTale Press</div>
                <div style="margin-top:0.5rem;font-size:0.7rem;">${EMAIL}</div>
                <div class="disclaimer-text">${DISCLAIMER}</div>
            </div>`;
    }

    // ===== STORY TITLE PAGE =====
    function createStoryTitlePage(title, authors) {
        return `
            <div class="story-title-page">
                <div class="story-title-main">${title}</div>
                <div class="story-authors">By ${authors}</div>
            </div>`;
    }

    // ===== ROBUST PAGINATION (strips tags for counting) =====
    function paginateChapters(title, authors, chapters, status) {
        const pagesForStory = [];
        pagesForStory.push({ html: createStoryTitlePage(title, authors), isStoryTitle: true });

        if (!chapters || chapters.length === 0) return pagesForStory;

        // Build visible text (no HTML tags) to measure length
        let fullPlainText = '';
        chapters.forEach(ch => {
            fullPlainText += `Session ${ch.chapterNumber} — by ${ch.authorName}\n`;
            fullPlainText += ch.content + '\n\n';
        });

        // Now build the HTML version that matches the plain text structure
        let htmlSegments = [];
        chapters.forEach(ch => {
            htmlSegments.push(`<span class="session-label">Session ${ch.chapterNumber} — by ${ch.authorName}</span>`);
            htmlSegments.push(ch.content);   // the actual content (may have HTML? no, it's plain text from RelayTale)
        });

        // We'll paginate based on plain text character count, but keep the HTML.
        let currentText = '';
        let currentHtml = '';
        let currentChars = 0;

        // Combine segments: for each session, we have label + content.
        for (let i = 0; i < chapters.length; i++) {
            const labelText = `Session ${chapters[i].chapterNumber} — by ${chapters[i].authorName}`;
            const contentText = chapters[i].content;

            // Add label (with a newline)
            const labelWithNewline = labelText + '\n';
            if (currentChars + labelWithNewline.length > MAX_CHARS_PER_PAGE && currentChars > 0) {
                // save current page
                pagesForStory.push({ html: `<div style="padding:1rem;"><div class="story-text">${currentHtml}</div></div>` });
                currentText = '';
                currentHtml = '';
                currentChars = 0;
            }
            currentText += labelWithNewline;
            currentHtml += `<span class="session-label">${labelText}</span>\n`;
            currentChars += labelWithNewline.length;

            // Now add content (with double newline after)
            const contentWithNewline = contentText + '\n\n';
            // If content doesn't fit on current page, split it by words
            if (currentChars + contentWithNewline.length > MAX_CHARS_PER_PAGE) {
                // need to split content
                const words = contentText.split(/\s+/);
                let chunkText = '';
                let chunkHtml = '';
                let chunkChars = 0;
                for (const word of words) {
                    const wordLen = word.length + (chunkChars > 0 ? 1 : 0); // space
                    if (chunkChars + wordLen > MAX_CHARS_PER_PAGE && chunkChars > 0) {
                        // finalise chunk
                        if (currentChars > 0) {
                            currentText += '\n\n' + chunkText;
                            currentHtml += '\n\n' + chunkHtml;
                        } else {
                            currentText = chunkText;
                            currentHtml = chunkHtml;
                        }
                        pagesForStory.push({ html: `<div style="padding:1rem;"><div class="story-text">${currentHtml}</div></div>` });
                        currentText = '';
                        currentHtml = '';
                        currentChars = 0;
                        chunkText = word;
                        chunkHtml = word;
                        chunkChars = word.length;
                    } else {
                        if (chunkChars > 0) { chunkText += ' '; chunkHtml += ' '; }
                        chunkText += word;
                        chunkHtml += word;
                        chunkChars += wordLen;
                    }
                }
                // remaining chunk
                if (chunkText) {
                    if (currentChars > 0) {
                        currentText += '\n\n' + chunkText;
                        currentHtml += '\n\n' + chunkHtml;
                    } else {
                        currentText = chunkText;
                        currentHtml = chunkHtml;
                    }
                    currentChars += chunkChars;
                }
                // after chunk, add the double newlines that would normally end the content
                currentText += '\n\n';
                currentHtml += '\n\n';
                currentChars += 2;
            } else {
                // fits entirely
                if (currentChars > 0) {
                    currentText += '\n\n' + contentText;
                    currentHtml += '\n\n' + contentText;
                } else {
                    currentText = contentText;
                    currentHtml = contentText;
                }
                currentText += '\n\n';
                currentHtml += '\n\n';
                currentChars += contentWithNewline.length;
            }
        }

        // Add final page if not empty
        if (currentHtml.trim().length > 0) {
            // Merge very short last page with previous
            if (currentChars < ORPHAN_MIN_CHARS && pagesForStory.length > 0) {
                const lastPage = pagesForStory[pagesForStory.length - 1];
                lastPage.html = lastPage.html.replace('</div></div>', `\n\n${currentHtml}</div></div>`);
            } else {
                pagesForStory.push({ html: `<div style="padding:1rem;"><div class="story-text">${currentHtml}</div></div>` });
            }
        }

        // Add end marker + share to last text page
        const lastIdx = pagesForStory.length - 1;
        const safeTitle = title.replace(/'/g, "\\'");
        const endHtml = `<p class="story-end">${status === 'completed' ? '🏁 The End' : '✍️ In Progress'} <span class="share-mini" onclick="shareStory('${safeTitle}')">Share</span></p>`;
        pagesForStory[lastIdx].html = pagesForStory[lastIdx].html.replace('</div></div>', `${endHtml}</div></div>`);

        return pagesForStory;
    }

    // ===== BUILD PAGES & ANIMATE =====
    function renderBook() {
        flipContainer.innerHTML = '';
        for (let i = pages.length - 1; i >= 0; i--) {
            const pageData = pages[i];
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.dataset.index = i;
            pageDiv.style.zIndex = pages.length - i;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'page-content';
            if (pageData.isCover || pageData.isStoryTitle) {
                contentDiv.style.padding = '0';
                contentDiv.style.overflow = 'hidden';
            }
            contentDiv.innerHTML = pageData.html;

            const pageNum = document.createElement('div');
            pageNum.className = 'page-number';
            pageNum.textContent = i + 1;

            pageDiv.appendChild(contentDiv);
            pageDiv.appendChild(pageNum);

            // Apply flipped state
            if (i < currentPageIndex) {
                pageDiv.classList.add('flipped');
            }

            flipContainer.appendChild(pageDiv);
        }
        updateNav();
    }

    function flipTo(index) {
        if (isAnimating || index === currentPageIndex || index < 0 || index >= pages.length) return;
        isAnimating = true;

        const currentPage = flipContainer.querySelector(`[data-index="${currentPageIndex}"]`);
        const targetPage = flipContainer.querySelector(`[data-index="${index}"]`);

        if (index > currentPageIndex) {
            // flipping forward: flip current page
            if (currentPage) {
                currentPage.addEventListener('transitionend', function handler() {
                    currentPage.removeEventListener('transitionend', handler);
                    isAnimating = false;
                    updateNav();
                });
                currentPage.classList.add('flipped');
            }
        } else {
            // flipping backward: unflip the target page (which is already flipped)
            if (targetPage) {
                targetPage.addEventListener('transitionend', function handler() {
                    targetPage.removeEventListener('transitionend', handler);
                    isAnimating = false;
                    updateNav();
                });
                targetPage.classList.remove('flipped');
            }
        }
        currentPageIndex = index;
    }

    function nextPage() { flipTo(currentPageIndex + 1); }
    function prevPage() { flipTo(currentPageIndex - 1); }

    function updateNav() {
        prevBtn.disabled = currentPageIndex === 0;
        nextBtn.disabled = currentPageIndex === pages.length - 1;
        pageIndicator.textContent = currentPageIndex === 0 ? 'Cover' : currentPageIndex === pages.length - 1 ? 'Back Cover' : `Page ${currentPageIndex + 1} of ${pages.length}`;
    }

    // ===== SHARE =====
    window.shareStory = function(title) {
        const url = window.location.href;
        const text = `Read "${title}" from RelayTale Monthly.`;
        if (navigator.share) navigator.share({ title, text, url }).catch(() => {});
        else {
            navigator.clipboard.writeText(text + ' ' + url).then(() => alert('Link copied!')).catch(() => prompt('Copy:', url));
        }
    };

    // ===== FETCH FROM APPWRITE =====
    window.fetchLiveStories = async function() {
        if (PROJECT_ID === 'YOUR_PROJECT_ID') {
            alert('Please replace YOUR_PROJECT_ID with your real Appwrite Project ID.');
            return;
        }
        const statusEl = document.getElementById('fetchStatusCover') || document.createElement('div');
        statusEl.textContent = 'Fetching...';
        try {
            const client = new Appwrite.Client();
            client.setEndpoint(ENDPOINT).setProject(PROJECT_ID);
            const databases = new Appwrite.Databases(client);
            const storiesRes = await databases.listDocuments(DATABASE_ID, STORIES_COLLECTION);
            if (storiesRes.documents.length === 0) {
                statusEl.textContent = 'No stories found.';
                return;
            }

            const newPages = [];
            const coverSubtitle = `Featuring: ${storiesRes.documents.map(s => s.title).join(' • ')}`;
            newPages.push({ html: createCoverPage('RelayTale', coverSubtitle, false), isCover: true });

            for (const story of storiesRes.documents) {
                const s1Res = await databases.listDocuments(DATABASE_ID, CHAPTERS_COLLECTION, [
                    Appwrite.Query.equal('storyId', story.$id),
                    Appwrite.Query.equal('chapterNumber', 1)
                ]);
                const session1 = s1Res.documents.length > 0 ? [s1Res.documents[0]] : [];
                const isBranching = (story.isBranching === 'true' || story.isBranching === true);
                const authors = story.writers || story.creatorName;

                if (isBranching) {
                    for (const flowId of ['flow1', 'flow2', 'flow3']) {
                        const flowNumber = flowId.slice(-1);
                        const chRes = await databases.listDocuments(DATABASE_ID, CHAPTERS_COLLECTION, [
                            Appwrite.Query.equal('storyId', story.$id),
                            Appwrite.Query.equal('flowId', flowId),
                            Appwrite.Query.orderAsc('chapterNumber')
                        ]);
                        if (chRes.documents.length === 0) continue;
                        const flowChapters = [...session1, ...chRes.documents];
                        const flowTitle = `${story.title} — ${flowNumber}`;
                        const storyPages = paginateChapters(flowTitle, authors, flowChapters, story.status);
                        newPages.push(...storyPages);
                    }
                } else {
                    const chRes = await databases.listDocuments(DATABASE_ID, CHAPTERS_COLLECTION, [
                        Appwrite.Query.equal('storyId', story.$id),
                        Appwrite.Query.orderAsc('chapterNumber')
                    ]);
                    const storyPages = paginateChapters(story.title, authors, chRes.documents, story.status);
                    newPages.push(...storyPages);
                }
            }

            newPages.push({ html: createBackCover(), isCover: true });

            pages = newPages;
            currentPageIndex = 0;
            renderBook();
            statusEl.textContent = `✅ Loaded ${storiesRes.documents.length} stories!`;
        } catch (err) {
            statusEl.textContent = '❌ Error: ' + err.message;
            console.error(err);
        }
    };

    // ===== INITIALISE WITH SAMPLE COVER =====
    pages = [{ html: createCoverPage('RelayTale', 'Sample Issue', true), isCover: true }];
    renderBook();

    // ===== KEYBOARD & TOUCH (stable) =====
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextPage(); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevPage(); }
    });

    let touchStartX = 0, touchStartY = 0;
    const bookEl = document.querySelector('.book-flip-container');
    bookEl.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });
    bookEl.addEventListener('touchend', (e) => {
        const dx = touchStartX - e.changedTouches[0].clientX;
        const dy = touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
            e.preventDefault();
            if (dx > 0) nextPage();
            else prevPage();
        }
    });
    // prevent scrolling while swiping horizontally
    bookEl.addEventListener('touchmove', (e) => {
        if (Math.abs(e.touches[0].clientX - touchStartX) > Math.abs(e.touches[0].clientY - touchStartY)) {
            e.preventDefault();
        }
    }, { passive: false });
</script>
</body>
</html>
