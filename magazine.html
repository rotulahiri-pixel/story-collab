<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RelayTale Magazine</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.2"></script>
    <style>
        :root {
            --cream: #f5f0e8;
            --sepia: #e8dcc8;
            --ink: #2c2416;
            --accent: #8b4513;
            --gold: #b8860b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #2c1810;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        /* Book wrapper – fills available space, max width for readability */
        .book-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .book-spine {
            position: absolute;
            top: 0; left: -22px; bottom: 0; width: 22px;
            background: linear-gradient(to right, #3c1e0f, #5a2d1a, #3c1e0f);
            border-radius: 5px 0 0 5px;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .book-flip-container {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1500px;
        }
        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--cream);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 30px rgba(139,69,19,0.05);
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            backface-visibility: hidden;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }
        .page.flipped {
            transform: rotateY(-180deg);
        }
        .page-content {
            flex: 1;
            padding: 1.5rem 1.2rem 3rem 1.2rem;  /* extra bottom for arrows */
            overflow-y: auto;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--ink);
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .page-number {
            text-align: center;
            font-size: 0.7rem;
            color: var(--accent);
            padding: 0.4rem;
            border-top: 1px solid var(--sepia);
            background: var(--cream);
        }

        /* Navigation arrows at page bottom */
        .nav-arrows {
            position: absolute;
            bottom: 0.8rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 1.5rem;
            pointer-events: none;
            z-index: 10;
        }
        .nav-arrow {
            background: transparent;
            border: none;
            font-size: 2rem;
            color: #aaa;
            cursor: pointer;
            pointer-events: auto;
            line-height: 1;
            padding: 0 0.2rem;
            transition: color 0.2s;
        }
        .nav-arrow:active { color: var(--accent); }
        .nav-arrow:disabled { opacity: 0.3; pointer-events: none; }

        /* Morocco leather cover */
        .cover-page {
            background: linear-gradient(135deg, #5a2d1a 0%, #3c1e0f 40%, #2a1005 100%);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding-top: 25%;
            position: relative;
            height: 100%;
            color: var(--cream);
        }
        .cover-page::before,
        .cover-page::after,
        .cover-page .corner-tr,
        .cover-page .corner-bl {
            position: absolute;
            width: 40px; height: 40px;
            border: 3px solid var(--gold);
            z-index: 2;
        }
        .cover-page::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
        .cover-page::after { bottom: 8px; right: 8px; border-left: none; border-top: none; }
        .cover-page .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
        .cover-page .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }

        .cover-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            margin-bottom: 0.5rem;
        }
        .cover-subtitle {
            font-size: 0.8rem;
            font-style: italic;
            color: var(--cream);
            letter-spacing: 2px;
        }
        .cover-divider {
            width: 50%;
            margin: 1rem auto;
            border-top: 2px double var(--gold);
        }
        .cover-fetch-btn {
            background: var(--gold);
            color: var(--ink);
            border: 2px solid var(--accent);
            padding: 0.5rem 1rem;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            margin-top: auto;
            margin-bottom: 1.5rem;
        }
        .cover-fetch-btn:hover { background: var(--accent); color: var(--cream); }
        .fetch-status {
            color: var(--cream);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* Story title page */
        .story-title-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding-top: 25%;
            height: 100%;
            color: var(--ink);
            background: var(--cream);
        }
        .story-title-main {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            max-width: 90%;
            margin-bottom: 0.5rem;
        }

        /* Typography */
        .story-authors { font-size: 0.7rem; font-style: italic; color: var(--accent); margin-top: 0.5rem; }
        .story-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--ink);
            text-align: justify;
            white-space: pre-wrap;
        }
        .session-label { font-style: italic; color: var(--accent); font-size: 0.75rem; margin-bottom: 0.2rem; display: block; }
        .story-end { text-align: center; font-style: italic; color: var(--accent); margin-top: 0.4rem; font-size: 0.8rem; }
        .share-mini { font-size: 0.7rem; color: var(--accent); cursor: pointer; text-decoration: underline; margin-left: 0.5rem; }
        .disclaimer-text { font-size: 0.7rem; color: var(--cream); line-height: 1.5; margin-top: 2rem; opacity: 0.8; padding: 0 1rem; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="book-wrapper" id="bookWrapper">
        <div class="book-spine"></div>
        <div class="book-flip-container" id="flipContainer"></div>
    </div>
</div>

<script>
    // ===== CONFIGURATION =====
    const PROJECT_ID = 'rotulahiri';   // ← CHANGE THIS
    const DATABASE_ID = 'stories_db';
    const STORIES_COLLECTION = 'stories';
    const CHAPTERS_COLLECTION = 'chapters';
    const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
    const EMAIL = 'relaytale@gmail.com';

    const MAX_CHARS_PER_PAGE = 3200;
    const ORPHAN_MIN_CHARS = 100;

    const DISCLAIMER = `Disclaimer: The creator of this app has no control over, and assumes no responsibility or liability for, any content, opinions, or views expressed by users on this platform. User‑generated content does not reflect the views of the creator, and all interactions and posts are the sole responsibility of the respective users. The Intellectual Property Rights of the collaborative effort will rest with the platform presently.`;

    // ===== STATE =====
    let pages = [];                     // {html, isCover, isStoryTitle}
    let currentPageIndex = 0;
    let isAnimating = false;

    const flipContainer = document.getElementById('flipContainer');

    // ===== PAGE BUILDERS =====
    function createCoverPage(title, subtitle, includeFetch = false) {
        const fetchHTML = includeFetch ? `
            <button class="cover-fetch-btn" onclick="fetchLiveStories()">📡 Fetch Stories from Appwrite</button>
            <div id="fetchStatusCover" class="fetch-status"></div>
        ` : '';
        return `
            <div class="cover-page">
                <span class="corner-tl"></span><span class="corner-tr"></span><span class="corner-bl"></span><span class="corner-br"></span>
                <div class="cover-title">${title}</div>
                <div class="cover-divider"></div>
                <div class="cover-subtitle">Where Writers Create Stories By Turn</div>
                <div style="margin-top:2rem;font-size:0.8rem;letter-spacing:2px;">${subtitle}</div>
                <div style="margin-top:1rem;font-size:0.7rem;">${EMAIL}</div>
                ${fetchHTML}
            </div>`;
    }

    function createBackCover() {
        return `
            <div class="cover-page">
                <span class="corner-tl"></span><span class="corner-tr"></span><span class="corner-bl"></span><span class="corner-br"></span>
                <div class="cover-title" style="font-size:2rem;">RelayTale</div>
                <div class="cover-divider"></div>
                <div class="cover-subtitle">Where Writers Create Stories By Turn</div>
                <div style="margin-top:1.5rem;font-size:0.8rem;letter-spacing:2px;">Published by RelayTale Press</div>
                <div style="margin-top:0.5rem;font-size:0.7rem;">${EMAIL}</div>
                <div class="disclaimer-text">${DISCLAIMER}</div>
            </div>`;
    }

    function createStoryTitlePage(title, authors) {
        return `
            <div class="story-title-page">
                <div class="story-title-main">${title}</div>
                <div class="story-authors">By ${authors}</div>
            </div>`;
    }

    // ===== PAGINATION (robust) =====
    function paginateChapters(title, authors, chapters, status) {
        const pagesForStory = [];
        pagesForStory.push({ html: createStoryTitlePage(title, authors), isStoryTitle: true });

        if (!chapters || chapters.length === 0) return pagesForStory;

        let currentHtml = '';
        let currentChars = 0;

        for (let i = 0; i < chapters.length; i++) {
            const ch = chapters[i];
            const labelHtml = `<span class="session-label">Session ${ch.chapterNumber} — by ${ch.authorName}</span>`;
            const contentHtml = ch.content;   // plain text

            // Combine label + newline + content + double newline
            const segmentHtml = labelHtml + '\n' + contentHtml + '\n\n';
            const segmentChars = (ch.content.length + labelHtml.length + 3); // rough

            if (currentChars + segmentChars > MAX_CHARS_PER_PAGE && currentChars > 0) {
                // Save current page
                pagesForStory.push({ html: `<div class="story-text">${currentHtml}</div>` });
                currentHtml = '';
                currentChars = 0;
            }

            // Now add the segment (might still be too large, split content if needed)
            if (segmentChars > MAX_CHARS_PER_PAGE) {
                // split content into multiple pages
                const words = contentHtml.split(/\s+/);
                let chunk = '';
                let chunkChars = 0;
                // add label first
                currentHtml += labelHtml + '\n';
                currentChars += labelHtml.length + 1;

                for (const word of words) {
                    const wordLen = word.length + 1;
                    if (chunkChars + wordLen > MAX_CHARS_PER_PAGE && chunkChars > 0) {
                        currentHtml += chunk;
                        pagesForStory.push({ html: `<div class="story-text">${currentHtml}</div>` });
                        currentHtml = '';
                        currentChars = 0;
                        chunk = word;
                        chunkChars = word.length;
                    } else {
                        chunk += (chunk ? ' ' : '') + word;
                        chunkChars += wordLen;
                    }
                }
                if (chunk) {
                    currentHtml += chunk + '\n\n';
                    currentChars += chunkChars + 2;
                }
            } else {
                currentHtml += segmentHtml;
                currentChars += segmentChars;
            }
        }

        // Final page
        if (currentHtml.trim().length > 0) {
            // Orphan control: if last page is very short, merge with previous
            if (currentChars < ORPHAN_MIN_CHARS && pagesForStory.length > 0) {
                const lastPage = pagesForStory[pagesForStory.length - 1];
                lastPage.html = lastPage.html.replace('</div>', `\n\n${currentHtml}</div>`);
            } else {
                pagesForStory.push({ html: `<div class="story-text">${currentHtml}</div>` });
            }
        }

        // Add end marker + share to last text page
        const lastIdx = pagesForStory.length - 1;
        const safeTitle = title.replace(/'/g, "\\'");
        const endHtml = `<p class="story-end">${status === 'completed' ? '🏁 The End' : '✍️ In Progress'} <span class="share-mini" onclick="shareStory('${safeTitle}')">Share</span></p>`;
        let lastHtml = pagesForStory[lastIdx].html;
        // Insert before closing div if there's a wrapper div (story-text), else just append
        if (lastHtml.includes('<div class="story-text">')) {
            lastHtml = lastHtml.replace('</div>', `${endHtml}</div>`);
        } else {
            lastHtml += endHtml;
        }
        pagesForStory[lastIdx].html = lastHtml;

        return pagesForStory;
    }

    // ===== RENDER BOOK =====
    function renderBook() {
        flipContainer.innerHTML = '';
        for (let i = pages.length - 1; i >= 0; i--) {
            const pageData = pages[i];
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.dataset.index = i;
            pageDiv.style.zIndex = pages.length - i;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'page-content';
            if (pageData.isCover || pageData.isStoryTitle) {
                contentDiv.style.padding = '0';
                contentDiv.style.overflow = 'hidden';
            }
            contentDiv.innerHTML = pageData.html;

            // Add navigation arrows inside page content (only for non-cover pages maybe, but we'll add to all)
            const arrowsDiv = document.createElement('div');
            arrowsDiv.className = 'nav-arrows';
            arrowsDiv.innerHTML = `
                <button class="nav-arrow" id="prevArrow" onclick="prevPage()">‹</button>
                <button class="nav-arrow" id="nextArrow" onclick="nextPage()">›</button>
            `;
            contentDiv.appendChild(arrowsDiv);

            const pageNum = document.createElement('div');
            pageNum.className = 'page-number';
            pageNum.textContent = i + 1;

            pageDiv.appendChild(contentDiv);
            pageDiv.appendChild(pageNum);

            if (i < currentPageIndex) {
                pageDiv.classList.add('flipped');
            }

            flipContainer.appendChild(pageDiv);
        }
        updateArrowStates();
    }

    function flipTo(index) {
        if (isAnimating || index === currentPageIndex || index < 0 || index >= pages.length) return;
        isAnimating = true;

        const currentPage = flipContainer.querySelector(`[data-index="${currentPageIndex}"]`);
        const targetPage = flipContainer.querySelector(`[data-index="${index}"]`);

        if (index > currentPageIndex) {
            if (currentPage) {
                currentPage.addEventListener('transitionend', function handler() {
                    currentPage.removeEventListener('transitionend', handler);
                    isAnimating = false;
                    updateArrowStates();
                });
                currentPage.classList.add('flipped');
            }
        } else {
            // Going back: unflip the page at the new index
            if (targetPage) {
                targetPage.addEventListener('transitionend', function handler() {
                    targetPage.removeEventListener('transitionend', handler);
                    isAnimating = false;
                    updateArrowStates();
                });
                targetPage.classList.remove('flipped');
            }
        }
        currentPageIndex = index;
    }

    function nextPage() { flipTo(currentPageIndex + 1); }
    function prevPage() { flipTo(currentPageIndex - 1); }

    function updateArrowStates() {
        const prevArrows = flipContainer.querySelectorAll('#prevArrow');
        const nextArrows = flipContainer.querySelectorAll('#nextArrow');
        prevArrows.forEach(a => a.disabled = currentPageIndex === 0);
        nextArrows.forEach(a => a.disabled = currentPageIndex === pages.length - 1);
    }

    // ===== SHARE =====
    window.shareStory = function(title) {
        const url = window.location.href;
        const text = `Read "${title}" from RelayTale Monthly.`;
        if (navigator.share) navigator.share({ title, text, url }).catch(() => {});
        else {
            navigator.clipboard.writeText(text + ' ' + url).then(() => alert('Link copied!')).catch(() => prompt('Copy:', url));
        }
    };

    // ===== FETCH FROM APPWRITE =====
    window.fetchLiveStories = async function() {
        if (PROJECT_ID === 'YOUR_PROJECT_ID') {
            alert('Please replace YOUR_PROJECT_ID with your real Appwrite Project ID.');
            return;
        }
        const statusEl = document.getElementById('fetchStatusCover') || document.createElement('div');
        if (statusEl) statusEl.textContent = 'Fetching...';
        try {
            const client = new Appwrite.Client();
            client.setEndpoint(ENDPOINT).setProject(PROJECT_ID);
            const databases = new Appwrite.Databases(client);
            const storiesRes = await databases.listDocuments(DATABASE_ID, STORIES_COLLECTION);
            if (storiesRes.documents.length === 0) {
                if (statusEl) statusEl.textContent = 'No stories found.';
                return;
            }

            const newPages = [];
            const coverSubtitle = `Featuring: ${storiesRes.documents.map(s => s.title).join(' • ')}`;
            newPages.push({ html: createCoverPage('RelayTale', coverSubtitle, false), isCover: true });

            for (const story of storiesRes.documents) {
                const s1Res = await databases.listDocuments(DATABASE_ID, CHAPTERS_COLLECTION, [
                    Appwrite.Query.equal('storyId', story.$id),
                    Appwrite.Query.equal('chapterNumber', 1)
                ]);
                const session1 = s1Res.documents.length > 0 ? [s1Res.documents[0]] : [];
                const isBranching = (story.isBranching === 'true' || story.isBranching === true);
                const authors = story.writers || story.creatorName;

                if (isBranching) {
                    for (const flowId of ['flow1', 'flow2', 'flow3']) {
                        const flowNumber = flowId.slice(-1);
                        const chRes = await databases.listDocuments(DATABASE_ID, CHAPTERS_COLLECTION, [
                            Appwrite.Query.equal('storyId', story.$id),
                            Appwrite.Query.equal('flowId', flowId),
                            Appwrite.Query.orderAsc('chapterNumber')
                        ]);
                        if (chRes.documents.length === 0) continue;
                        const flowChapters = [...session1, ...chRes.documents];
                        const flowTitle = `${story.title} — ${flowNumber}`;
                        const storyPages = paginateChapters(flowTitle, authors, flowChapters, story.status);
                        newPages.push(...storyPages);
                    }
                } else {
                    const chRes = await databases.listDocuments(DATABASE_ID, CHAPTERS_COLLECTION, [
                        Appwrite.Query.equal('storyId', story.$id),
                        Appwrite.Query.orderAsc('chapterNumber')
                    ]);
                    const storyPages = paginateChapters(story.title, authors, chRes.documents, story.status);
                    newPages.push(...storyPages);
                }
            }

            newPages.push({ html: createBackCover(), isCover: true });

            pages = newPages;
            currentPageIndex = 0;
            renderBook();
            if (statusEl) statusEl.textContent = `✅ Loaded ${storiesRes.documents.length} stories!`;
        } catch (err) {
            if (statusEl) statusEl.textContent = '❌ Error: ' + err.message;
            console.error(err);
        }
    };

    // ===== INITIAL SAMPLE COVER =====
    pages = [{ html: createCoverPage('RelayTale', 'Sample Issue', true), isCover: true }];
    renderBook();

    // ===== KEYBOARD & TOUCH =====
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextPage(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
    });

    let touchStartX = 0, touchStartY = 0;
    const bookEl = document.querySelector('.book-flip-container');
    bookEl.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });
    bookEl.addEventListener('touchend', (e) => {
        const dx = touchStartX - e.changedTouches[0].clientX;
        const dy = touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
            e.preventDefault();
            if (dx > 0) nextPage();
            else prevPage();
        }
    });
    bookEl.addEventListener('touchmove', (e) => {
        if (Math.abs(e.touches[0].clientX - touchStartX) > Math.abs(e.touches[0].clientY - touchStartY)) {
            e.preventDefault();
        }
    }, { passive: false });
</script>
</body>
</html>
